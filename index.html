
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comandas del Bar</title>

<style>
:root {
  --bg: #f4f5f7;
  --primary: #176b52;
  --dark: #18352d;
  --white: #ffffff;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #222;
}

header {
  background: var(--dark);
  color: white;
  padding: 22px 16px;
  text-align: center;
}

header h1 { margin: 0 0 7px; }
header p { margin: 0; color: #d6e9e0; }

main {
  max-width: 1000px;
  margin: auto;
  padding: 16px;
}

.panel {
  background: white;
  padding: 16px;
  margin-bottom: 16px;
  border-radius: 14px;
  box-shadow: 0 2px 8px #0000000c;
}

h2 { margin-top: 0; font-size: 20px; }

.tables {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 9px;
  padding: 12px 8px;
  font-size: 14px;
  font-weight: bold;
}

.table-btn {
  background: #e6e9ec;
  color: #333;
  min-height: 65px;
}

.table-btn.active {
  background: var(--primary);
  color: white;
}

.table-btn.occupied:not(.active) {
  background: #f9dfb5;
  color: #744600;
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

.people {
  display: flex;
  align-items: center;
  gap: 12px;
}

.people input { max-width: 110px; }

.categories {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.categories button {
  background: #e7eee9;
  color: var(--dark);
}

.categories button.active {
  background: var(--primary);
  color: white;
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.product {
  text-align: left;
  background: #f6f8f7;
  border: 1px solid #e1e7e3;
  min-height: 76px;
}

.product span {
  display: block;
  margin-top: 8px;
  color: var(--primary);
}

.primary {
  background: var(--primary);
  color: white;
}

.danger {
  background: #b42318;
  color: white;
}

.secondary {
  background: #e8ecea;
  color: #253a32;
}

.order-item {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.item-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.item-note {
  color: #666;
  font-size: 13px;
  margin-top: 6px;
}

.item-actions {
  display: flex;
  gap: 8px;
  margin-top: 9px;
  align-items: center;
}

.item-actions button { padding: 7px 12px; }

.total {
  display: flex;
  justify-content: space-between;
  font-size: 22px;
  font-weight: bold;
  padding: 18px 0;
}

.actions {
  display: grid;
  gap: 9px;
}

.actions button { padding: 15px; }

.muted { color: #777; font-size: 14px; }

@media (min-width: 700px) {
  .tables { grid-template-columns: repeat(6, 1fr); }
  .menu { grid-template-columns: repeat(3, 1fr); }
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
}
</style>
</head>

<body>
<header>
  <h1>🍽️ Comandas del Bar</h1>
  <p>Gestión de mesas, pedidos y cuentas</p>
</header>

<main>
  <section class="panel">
    <h2>1. Selecciona una mesa</h2>
    <div class="tables" id="tables"></div>
  </section>

  <div class="layout">
    <div>
      <section class="panel">
        <h2 id="tableTitle">Mesa 1</h2>

        <label for="people">Número de personas</label>
        <div class="people">
          <input id="people" type="number" min="1" max="50" value="2">
          <span>comensales</span>
        </div>

        <label for="waiter">Camarero/a</label>
        <input id="waiter" placeholder="Nombre del camarero">

        <label for="note">Nota para la comanda</label>
        <input id="note" placeholder="Ej. terraza, alergias...">

        <p class="muted">
          Selecciona un producto para añadirlo al pedido.
        </p>
      </section>

      <section class="panel">
        <h2>2. Carta</h2>
        <div class="categories" id="categories"></div>
        <div class="menu" id="menu"></div>
      </section>
    </div>

    <div>
      <section class="panel">
        <h2>3. Pedido actual</h2>
        <div id="order"></div>

        <div class="total">
          <span>Total</span>
          <span id="total">0,00 €</span>
        </div>

        <div class="actions">
          <button class="primary" onclick="saveOrder()">
            💾 Guardar comanda
          </button>
          <button class="secondary" onclick="printOrder()">
            🖨️ Imprimir cuenta
          </button>
          <button class="danger" onclick="closeTable()">
            ✓ Cobrar y liberar mesa
          </button>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
// EDITA AQUÍ LOS PRODUCTOS Y SUS PRECIOS
const products = [
  {name:"Agua", price:2, cat:"Bebidas"},
  {name:"Agua con gas", price:2.5, cat:"Bebidas"},
  {name:"Coca-Cola", price:2.5, cat:"Bebidas"},
  {name:"Fanta", price:2.5, cat:"Bebidas"},
  {name:"Cerveza", price:3, cat:"Bebidas"},
  {name:"Café", price:1.5, cat:"Bebidas"},
  {name:"Té", price:1.5, cat:"Bebidas"},
  {name:"Vino", price:3.5, cat:"Bebidas"},
  {name:"Patatas fritas", price:4, cat:"Comida"},
  {name:"Hamburguesa", price:10, cat:"Comida"},
  {name:"Pizza", price:11, cat:"Comida"},
  {name:"Ensalada", price:8, cat:"Comida"},
  {name:"Bocadillo", price:7, cat:"Comida"},
  {name:"Tarta", price:4, cat:"Postres"},
  {name:"Helado", price:3.5, cat:"Postres"}
];

const money = n => n.toLocaleString("es-ES", {
  style:"currency", currency:"EUR"
});

let selectedTable = 1;
let category = "Todos";
let orders = {};

try {
  orders = JSON.parse(
    localStorage.getItem("barOrders") || "{}"
  );
} catch {
  orders = {};
}

function current() {
  if (!orders[selectedTable]) {
    orders[selectedTable] = {
      people: 2,
      waiter: "",
      note: "",
      items: []
    };
  }
  return orders[selectedTable];
}

function persist() {
  localStorage.setItem("barOrders", JSON.stringify(orders));
}

function renderTables() {
  document.getElementById("tables").innerHTML =
    Array.from({length:12}, (_, i) => {
      const n = i + 1;
      const occupied = orders[n] &&
        orders[n].items.length > 0;
      return `
        <button class="table-btn
          ${selectedTable === n ? "active" : ""}
          ${occupied ? "occupied" : ""}"
          onclick="selectTable(${n})">
          Mesa ${n}<br>
          <small>${occupied ? "Ocupada" : "Libre"}</small>
        </button>`;
    }).join("");
}

function selectTable(n) {
  selectedTable = n;
  current();
  renderAll();
}

function renderCategories() {
  const cats = ["Todos", "Bebidas", "Comida", "Postres"];
  document.getElementById("categories").innerHTML =
    cats.map(c => `
      <button class="${category === c ? "active" : ""}"
        onclick="setCategory('${c}')">${c}</button>
    `).join("");
}

function setCategory(c) {
  category = c;
  renderCategories();
  renderMenu();
}

function renderMenu() {
  const filtered = products.filter(p =>
    category === "Todos" || p.cat === category
  );

  document.getElementById("menu").innerHTML =
    filtered.map(p => `
      <button class="product"
        onclick="addProduct('${p.name.replace(/'/g, "\\'")}')">
        ${p.name}
        <span>${money(p.price)} · Añadir +</span>
      </button>
    `).join("");
}

function addProduct(name) {
  const p = products.find(x => x.name === name);
  if (!p) return;

  const o = current();
  const note = document.getElementById("note").value.trim();

  // Cada toque añade una unidad.
  // Si tiene una nota diferente, crea otra línea.
  const existing = o.items.find(i =>
    i.name === p.name && i.note === note
  );

  if (existing) {
    existing.qty++;
  } else {
    o.items.push({
      name: p.name,
      price: p.price,
      qty: 1,
      note
    });
  }

  o.people = Math.max(1,
    Number(document.getElementById("people").value) || 1);
  o.waiter = document.getElementById("waiter").value;
  o.note = note;

  persist();
  renderAll();
}

function changeQty(index, amount) {
  const items = current().items;
  if (!items[index]) return;

  items[index].qty += amount;
  if (items[index].qty <= 0) {
    items.splice(index, 1);
  }

  persist();
  renderAll();
}

function renderOrder() {
  const o = current();

  document.getElementById("tableTitle").textContent =
    "Mesa " + selectedTable;
  document.getElementById("people").value = o.people;
  document.getElementById("waiter").value = o.waiter;
  document.getElementById("note").value = o.note;

  const container = document.getElementById("order");

  if (!o.items.length) {
    container.innerHTML =
      '<p class="muted">Todavía no hay productos en esta mesa.</p>';
  } else {
    container.innerHTML = o.items.map((item, i) => `
      <div class="order-item">
        <div class="item-top">
          <strong>${escapeHTML(item.name)}</strong>
          <strong>${money(item.price * item.qty)}</strong>
        </div>
        ${item.note ? `<div class="item-note">
          Nota: ${escapeHTML(item.note)}</div>` : ""}
        <div class="item-actions">
          <button class="secondary"
            onclick="changeQty(${i},-1)">−</button>
          <span>${item.qty}</span>
          <button class="secondary"
            onclick="changeQty(${i},1)">+</button>
          <span class="muted">${money(item.price)} / unidad</span>
        </div>
      </div>
    `).join("");
  }

  const total = o.items.reduce(
    (sum, item) => sum + item.price * item.qty, 0
  );
  document.getElementById("total").textContent = money(total);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[ch]);
}

function saveOrder() {
  const o = current();
  o.people = Math.max(1,
    Number(document.getElementById("people").value) || 1);
  o.waiter = document.getElementById("waiter").value;
  o.note = document.getElementById("note").value;
  persist();
  renderTables();
  alert("Comanda guardada en este dispositivo.");
}

function closeTable() {
  const o = current();
  if (!o.items.length) {
    alert("Esta mesa no tiene productos.");
    return;
  }

  const total = o.items.reduce(
    (sum, item) => sum + item.price * item.qty, 0
  );

  if (!confirm("¿Confirmas el cobro de " +
      money(total) + " y liberar la mesa?")) return;

  delete orders[selectedTable];
  persist();
  renderAll();
}

function printOrder() {
  const o = current();
  if (!o.items.length) {
    alert("No hay productos para imprimir.");
    return;
  }

  const total = o.items.reduce(
    (sum, item) => sum + item.price * item.qty, 0
  );

  const w = window.open("", "_blank");
  if (!w) {
    alert("Permite las ventanas emergentes para imprimir.");
    return;
  }

  w.document.write(`
    <!DOCTYPE html><html lang="es"><head>
    <meta charset="UTF-8">
    <title>Cuenta mesa ${selectedTable}</title>
    <style>
      body{font-family:Arial;padding:24px}
      li{margin:12px 0}
    </style></head><body>
    <h2>Cuenta - Mesa ${selectedTable}</h2>
    <p>Personas: ${o.people}</p>
    <p>Camarero: ${escapeHTML(o.waiter || "-")}</p>
    <hr><ul>
    ${o.items.map(i => `<li>${escapeHTML(i.name)} × ${i.qty}
      — ${money(i.price * i.qty)}
      ${i.note ? "<br>Nota: " + escapeHTML(i.note) : ""}
      </li>`).join("")}
    </ul><hr><h2>Total: ${money(total)}</h2>
    <script>window.onload=()=>window.print();<\/script>
    </body></html>
  `);
  w.document.close();
}

function renderAll() {
  renderTables();
  renderCategories();
  renderMenu();
  renderOrder();
}

document.getElementById("people").addEventListener("change", () => {
  current().people = Math.max(1,
    Number(document.getElementById("people").value) || 1);
  persist();
});

document.getElementById("waiter").addEventListener("change", () => {
  current().waiter = document.getElementById("waiter").value;
  persist();
});

document.getElementById("note").addEventListener("change", () => {
  current().note = document.getElementById("note").value;
  persist();
});

renderAll();
</script>
</body>
</html>
